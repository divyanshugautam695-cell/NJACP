name: Build NJACP Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor web directory
        run: mkdir -p public && test -f public/index.html || printf '<!doctype html><html><head><meta charset="UTF-8"></head><body></body></html>' > public/index.html

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NJACP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NJACP-Android-APK
          path: NJACP.apk
          retention-days: 14
